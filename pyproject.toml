[tool.poetry]
name = "on3r"
version = "0.1.0"
description = ""
authors = ["Dillen <ludvig.dillen@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
opencv-python = "^4.8.1.78"
matplotlib = "^3.8.1"
scipy = "1.13.1"
omegaconf = "^2.3.0"
h5py = "^3.10.0"
seaborn = "^0.13.1"
tqdm = "^4.66.1"
open3d = "^0.18.0"
scikit-learn = "^1.3.2"
addict = "^2.4.0"
tensorboard = "^2.15.1"
numpy = "1.26.4"
albumentations = "*" 
kornia = "*"
joblib = "*"
lightglue = { git = "https://github.com/cvg/LightGlue.git" }
torch-tb-profiler = "^0.4.3"
torch-geometric = "^2.5.3"
mplcursors = "^0.5.3"
ipykernel = "^6.29.5"
pycolmap = "^3.11.1"
rerun-sdk = "^0.22.1"
concave-hull = "^0.0.9"
torch = {version = "2.2.2+cu118", source = "pytorch-cu118"}
torchvision = {version = "0.17.2+cu118", source = "pytorch-cu118"}
torchaudio = {version = "2.2.2+cu118", source = "pytorch-cu118"}
antlr4-python3-runtime = "^4.9"
hydra-core = "^1.3.2"
pylocba = {path = "locba", develop = true}
poselib = "*"
gradio = "^5.38.0"
einops = "^0.8.1"
pyglet = "<2"
huggingface-hub = {version = ">=0.22", extras = ["torch"]}
imagesize = "^1.4.1"
moge = {path = "MoGe"}
gtsam = "^4.2"
pypng = "^0.20220715.0"
hloc = {path = "Hierarchical-Localization"}

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.26.0"
wheel = "^0.45.1"

[tool.poetry.group.baselines]
optional = true

[tool.poetry.group.baselines.dependencies]
scikit-image = "*"
trimesh = "*"
pyrender = "*"
safetensors = "*"
pillow = "*"

[tool.poetry.group.roma]
optional = true

[tool.poetry.group.roma.dependencies]
loguru = "*"
timm = "*"
wandb = "*"




[tool.poetry.group.vggt-demo.dependencies]
gradio = "^5.37.0"
viser = "^1.0.0"
tqdm = "^4.67.1"

[[tool.poetry.source]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "supplemental"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | outputs
  | assets
  | assets_old
  | MoGe
  | RoMa
  | vggt
  | locba
  | Hierarchical-Localization
  | reloc3r
  | ace
  | external
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
extend_skip_glob = [
  "outputs/*",
  "assets/*",
  "assets_old/*",
  "MoGe/*",
  "RoMa/*",
  "vggt/*",
  "locba/*",
  "Hierarchical-Localization/*",
  "reloc3r/*",
  "ace/*",
  "external/*",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
